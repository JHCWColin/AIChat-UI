name: Build and Release

on:
  push:
    tags:
      - 'V*'
  # 手动触发用于验证构建流程：不解析标签、不上传 Release，仅产出构建结果。
  workflow_dispatch:

jobs:
  # ==================== Electron 桌面端构建 ====================
  build:
    name: Build Electron on ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync package version with release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#V}"
          if [[ "$TAG_VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-release$ ]]; then
            TAG_VERSION="${BASH_REMATCH[1]}"
          fi
          CURRENT_VERSION=$(node -p "require('./package.json').version")

          echo "Current version: $CURRENT_VERSION"
          echo "Tag version: $TAG_VERSION"

          if [ "$CURRENT_VERSION" != "$TAG_VERSION" ]; then
            npm version --no-git-tag-version "$TAG_VERSION"
          else
            echo "Version already matches tag, skipping npm version"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build model tokenizers
        run: npm run build:tokenizer

      - name: Build Electron app (skip MSI on Windows to avoid WiX error)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            npx electron-builder --win portable nsis --publish never
          else
            npx electron-builder --publish never
          fi

      - name: Upload artifacts to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.msi
            release/*.zip
            release/*.dmg
            release/*.deb
            release/*.AppImage
            release/*.blockmap
            release/latest*.yml
            dist/*.exe
            dist/*.msi
            dist/*.zip
            dist/*.dmg
            dist/*.deb
            dist/*.AppImage
            dist/*.blockmap
            dist/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==================== Android APK 构建 ====================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve app version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            APP_VERSION="${GITHUB_REF_NAME#V}"
            if [[ "$APP_VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-release$ ]]; then
              APP_VERSION="${BASH_REMATCH[1]}"
            fi
          else
            APP_VERSION=$(node -p "require('./package.json').version")
          fi
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "App version: $APP_VERSION"

      - name: Setup Capacitor (web-to-mobile)
        run: |
          npm install @capacitor/core@7.6.10 @capacitor/cli@7.6.10 @capacitor/android@7.6.10 --save-dev

      - name: Prepare web assets for mobile
        run: |
          mkdir -p www
          rsync -av \
            --exclude='main' \
            --exclude='test' \
            src/ www/

      - name: Initialize Capacitor project
        run: |
          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ]; then
            npx cap init "AIChatUI" "com.jhcwcolin.aiui" --web-dir=www
          fi
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Replace app icon (generate multi-density icons)
        run: |
          sudo apt-get update -y && sudo apt-get install -y imagemagick
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          find android/app/src/main/res -name "ic_launcher.xml" -delete
          find android/app/src/main/res -name "ic_launcher_foreground.png" -delete
          find android/app/src/main/res -name "ic_launcher_background.xml" -delete

          declare -A sizes=(
            ["mdpi"]="48x48"
            ["hdpi"]="72x72"
            ["xhdpi"]="96x96"
            ["xxhdpi"]="144x144"
            ["xxxhdpi"]="192x192"
          )

          for density in "${!sizes[@]}"; do
            size="${sizes[$density]}"
            convert src/assets/icons/icon.png -resize "$size" android/app/src/main/res/mipmap-${density}/ic_launcher.png
            echo "Generated ${density} icon (${size})"
          done

      - name: Set APK version
        run: |
          sed -i "s/versionName \"[^\"]*\"/versionName \"$APP_VERSION\"/" android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode $(date +%s)/" android/app/build.gradle

      - name: Fix Kotlin dependency conflict
        run: |
          sed -i '/^allprojects {/,/^}/{
            /^}/i\
            \    configurations.all {\
            \        resolutionStrategy {\
            \            force '\''org.jetbrains.kotlin:kotlin-stdlib:1.8.22'\''\
            \            force '\''org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'\''\
            \            force '\''org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'\''\
            \        }\
            \    }
          }' android/build.gradle

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/build.gradle
            android/gradle/wrapper/gradle-wrapper.properties

      # 签名证书随仓库公开（android-release.p12，alias=aiui，口令 12345678）。
      # 仅用于分发本应用的正式构建，不含任何第三方敏感信息。
      - name: Configure release signing
        run: |
          cp android-release.p12 android/app/release.p12
          echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/android/app/release.p12" >> "$GITHUB_ENV"

      - name: Build Release APK (signed)
        shell: bash
        run: |
          cd android
          build_release() {
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
              -Pandroid.injected.signing.store.type=PKCS12 \
              -Pandroid.injected.signing.store.password="12345678" \
              -Pandroid.injected.signing.key.alias="aiui" \
              -Pandroid.injected.signing.key.password="12345678"
          }

          gradle_log=$(mktemp)
          trap 'rm -f "$gradle_log"' EXIT
          if build_release 2>&1 | tee "$gradle_log"; then
            exit 0
          fi
          if ! grep -qE 'repo\.maven\.apache\.org/.*Received status code 429' "$gradle_log"; then
            exit 1
          fi

          echo '::warning::Maven Central returned HTTP 429. Retrying through the Google-hosted Central mirror.'
          find . ../node_modules/@capacitor/android -type f -name '*.gradle' -exec \
            sed -i 's|mavenCentral()|maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }|' {} +
          build_release

      - name: Rename APK
        run: |
          cd android/app/build/outputs/apk/release
          APK_FILE=$(ls *.apk | head -n1)
          NEW_NAME="AIChatUI-${APP_VERSION}-android.apk"
          mv "$APK_FILE" "$NEW_NAME"

      # 断言产物确实已签名，避免签名参数失效时静默发布未签名包。
      - name: Verify APK signature
        run: |
          APK="android/app/build/outputs/apk/release/AIChatUI-${APP_VERSION}-android.apk"
          APKSIGNER=$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found under $ANDROID_HOME/build-tools"
            exit 1
          fi
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: android/app/build/outputs/apk/release/AIChatUI-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==================== iOS Simulator 构建（使用 sips 生成图标，解决透明问题） ====================
  build-ios-simulator:
    name: Build iOS Simulator app
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve app version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            APP_VERSION="${GITHUB_REF_NAME#V}"
            if [[ "$APP_VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-release$ ]]; then
              APP_VERSION="${BASH_REMATCH[1]}"
            fi
          else
            APP_VERSION=$(node -p "require('./package.json').version")
          fi
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "App version: $APP_VERSION"

      - name: Setup Capacitor (web-to-mobile) for iOS
        run: |
          npm install @capacitor/core@7.6.10 @capacitor/cli@7.6.10 @capacitor/ios@7.6.10 --save-dev

      - name: Prepare web assets for mobile
        run: |
          mkdir -p www
          rsync -av \
            --exclude='main' \
            --exclude='test' \
            src/ www/

      - name: Initialize Capacitor project (iOS)
        run: |
          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ]; then
            npx cap init "AIChatUI" "com.jhcwcolin.aiui" --web-dir=www
          fi
          if [ ! -d ios ]; then
            npx cap add ios || echo "Capacitor iOS add had warnings, continuing"
          fi
          npx cap copy ios

      - name: Fix iOS deployment target and install pods
        run: |
          if [ -f ios/App/Podfile ]; then
            sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '15.0'/" ios/App/Podfile
          else
            cd ios/App && pod init
            sed -i '' "s/# platform :ios, '[0-9.]*'/platform :ios, '15.0'/" Podfile
          fi

          PROJECT_FILE="ios/App/App.xcodeproj/project.pbxproj"
          if [ -f "$PROJECT_FILE" ]; then
            sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 14.0/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g' "$PROJECT_FILE"
          fi

          cd ios/App && pod install --repo-update

      # ✅ 使用 sips 生成 iOS 图标（避免 ImageMagick 导致的透明问题）
      - name: Generate iOS icons from icon.png
        run: |
          ICON_DIR="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          rm -rf "$ICON_DIR"
          mkdir -p "$ICON_DIR"

          # sips 是 macOS 自带的图片处理工具，不会破坏 alpha 通道
          sips -z 20 20 src/assets/icons/icon.png --out "$ICON_DIR/Icon-App-20x20@1x.png"
          sips -z 40 40 src/assets/icons/icon.png --out "$ICON_DIR/Icon-App-20x20@2x.png"
          sips -z 60 60 src/assets/icons/icon.png --out "$ICON_DIR/Icon-App-20x20@3x.png"
          sips -z 29 29 src/assets/icons/icon.png --out "$ICON_DIR/Icon-App-29x29@1x.png"
          sips -z 58 58 src/assets/icons/icon.png --out "$ICON_DIR/Icon-App-29x29@2x.png"
          sips -z 87 87 src/assets/icons/icon.png --out "$ICON_DIR/Icon-App-29x29@3x.png"
          sips -z 40 40 src/assets/icons/icon.png --out "$ICON_DIR/Icon-App-40x40@1x.png"
          sips -z 80 80 src/assets/icons/icon.png --out "$ICON_DIR/Icon-App-40x40@2x.png"
          sips -z 120 120 src/assets/icons/icon.png --out "$ICON_DIR/Icon-App-40x40@3x.png"
          sips -z 120 120 src/assets/icons/icon.png --out "$ICON_DIR/Icon-App-60x60@2x.png"
          sips -z 180 180 src/assets/icons/icon.png --out "$ICON_DIR/Icon-App-60x60@3x.png"
          sips -z 76 76 src/assets/icons/icon.png --out "$ICON_DIR/Icon-App-76x76@1x.png"
          sips -z 152 152 src/assets/icons/icon.png --out "$ICON_DIR/Icon-App-76x76@2x.png"
          sips -z 167 167 src/assets/icons/icon.png --out "$ICON_DIR/Icon-App-83.5x83.5@2x.png"
          sips -z 1024 1024 src/assets/icons/icon.png --out "$ICON_DIR/Icon-App-1024x1024@1x.png"

          # 写入正确的 Contents.json
          cat > "$ICON_DIR/Contents.json" << 'EOF'
          {
            "images" : [
              {"idiom" : "iphone","scale" : "1x","size" : "20x20","filename" : "Icon-App-20x20@1x.png"},
              {"idiom" : "iphone","scale" : "2x","size" : "20x20","filename" : "Icon-App-20x20@2x.png"},
              {"idiom" : "iphone","scale" : "3x","size" : "20x20","filename" : "Icon-App-20x20@3x.png"},
              {"idiom" : "iphone","scale" : "1x","size" : "29x29","filename" : "Icon-App-29x29@1x.png"},
              {"idiom" : "iphone","scale" : "2x","size" : "29x29","filename" : "Icon-App-29x29@2x.png"},
              {"idiom" : "iphone","scale" : "3x","size" : "29x29","filename" : "Icon-App-29x29@3x.png"},
              {"idiom" : "iphone","scale" : "1x","size" : "40x40","filename" : "Icon-App-40x40@1x.png"},
              {"idiom" : "iphone","scale" : "2x","size" : "40x40","filename" : "Icon-App-40x40@2x.png"},
              {"idiom" : "iphone","scale" : "3x","size" : "40x40","filename" : "Icon-App-40x40@3x.png"},
              {"idiom" : "iphone","scale" : "2x","size" : "60x60","filename" : "Icon-App-60x60@2x.png"},
              {"idiom" : "iphone","scale" : "3x","size" : "60x60","filename" : "Icon-App-60x60@3x.png"},
              {"idiom" : "ipad","scale" : "1x","size" : "20x20","filename" : "Icon-App-20x20@1x.png"},
              {"idiom" : "ipad","scale" : "2x","size" : "20x20","filename" : "Icon-App-20x20@2x.png"},
              {"idiom" : "ipad","scale" : "1x","size" : "29x29","filename" : "Icon-App-29x29@1x.png"},
              {"idiom" : "ipad","scale" : "2x","size" : "29x29","filename" : "Icon-App-29x29@2x.png"},
              {"idiom" : "ipad","scale" : "1x","size" : "40x40","filename" : "Icon-App-40x40@1x.png"},
              {"idiom" : "ipad","scale" : "2x","size" : "40x40","filename" : "Icon-App-40x40@2x.png"},
              {"idiom" : "ipad","scale" : "1x","size" : "76x76","filename" : "Icon-App-76x76@1x.png"},
              {"idiom" : "ipad","scale" : "2x","size" : "76x76","filename" : "Icon-App-76x76@2x.png"},
              {"idiom" : "ipad","scale" : "2x","size" : "83.5x83.5","filename" : "Icon-App-83.5x83.5@2x.png"},
              {"idiom" : "ios-marketing","scale" : "1x","size" : "1024x1024","filename" : "Icon-App-1024x1024@1x.png"}
            ],
            "info" : {
              "version" : 1,
              "author" : "xcode"
            }
          }
          EOF

      - name: Build iOS Simulator .app
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath ./ios-build \
            build

      - name: Package Simulator .app into zip
        run: |
          cd ios-build/Build/Products/Debug-iphonesimulator
          ZIPNAME="AIChatUI-${APP_VERSION}-ios-simulator.zip"
          zip -r "$GITHUB_WORKSPACE/$ZIPNAME" App.app

      - name: Upload iOS Simulator zip to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: AIChatUI-*-ios-simulator.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
